services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_PUBLISHED_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-127.0.0.1:18789}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: ${OPENCLAW_TZ:-UTC}
    group_add:
      - "${OPENCLAW_HOST_GID:-20}"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      # Share host CLI auth so gemini/claude providers reuse existing OAuth
      # without re-login inside the container. File-level mounts only.
      - ${HOME}/.gemini/oauth_creds.json:/home/node/.gemini/oauth_creds.json
      - ${HOME}/.gemini/settings.json:/home/node/.gemini/settings.json
      - ${HOME}/.gemini/google_accounts.json:/home/node/.gemini/google_accounts.json
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.claude/.credentials.json:/home/node/.claude/.credentials.json
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-127.0.0.1:18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-127.0.0.1:18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: ${OPENCLAW_TZ:-UTC}
    group_add:
      - "${OPENCLAW_HOST_GID:-20}"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${HOME}/.gemini/oauth_creds.json:/home/node/.gemini/oauth_creds.json
      - ${HOME}/.gemini/settings.json:/home/node/.gemini/settings.json
      - ${HOME}/.gemini/google_accounts.json:/home/node/.gemini/google_accounts.json
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.claude/.credentials.json:/home/node/.claude/.credentials.json
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
