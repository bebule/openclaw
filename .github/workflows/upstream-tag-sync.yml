name: Upstream Tag Sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional upstream tag to sync. Leave empty to auto-select the latest merged upstream tag.
        required: false
        type: string
      base_branch:
        description: Base branch to prepare the sync pull request against.
        required: false
        default: main
        type: string
      tag_pattern:
        description: Tag glob used when auto-selecting the latest upstream tag.
        required: false
        default: v*
        type: string
      verification:
        description: Verification gate before pushing the new sync branch.
        required: true
        default: check
        type: choice
        options:
          - none
          - check
          - check-and-build
      pr_mode:
        description: Whether the sync pull request should open as draft or ready.
        required: true
        default: draft
        type: choice
        options:
          - draft
          - ready
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: upstream-tag-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.23.0"

jobs:
  sync_upstream_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Optional repository variables for scheduled runs:
      # - UPSTREAM_SYNC_BASE_BRANCH
      # - UPSTREAM_SYNC_TAG_PATTERN
      # - UPSTREAM_SYNC_VERIFICATION
      # - UPSTREAM_SYNC_PR_MODE
      BASE_BRANCH: ${{ inputs.base_branch || vars.UPSTREAM_SYNC_BASE_BRANCH || 'main' }}
      PR_MODE: ${{ inputs.pr_mode || vars.UPSTREAM_SYNC_PR_MODE || 'draft' }}
      TAG: ${{ inputs.tag || '' }}
      TAG_PATTERN: ${{ inputs.tag_pattern || vars.UPSTREAM_SYNC_TAG_PATTERN || 'v*' }}
      VERIFICATION: ${{ inputs.verification || vars.UPSTREAM_SYNC_VERIFICATION || 'check' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"
          install-deps: ${{ env.VERIFICATION == 'none' && 'false' || 'true' }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare sync branch
        id: sync
        env:
          RUNNER_TEMP_JSON: ${{ runner.temp }}/upstream-tag-sync.json
        run: |
          set -euo pipefail
          args=(
            --base-branch "${BASE_BRANCH}"
            --tag-pattern "${TAG_PATTERN}"
          )
          if [[ -n "${TAG}" ]]; then
            args+=(--target-tag "${TAG}")
          fi
          node scripts/upstream-tag-sync.mjs "${args[@]}" > "${RUNNER_TEMP_JSON}"
          cat "${RUNNER_TEMP_JSON}"

          status="$(jq -r '.status' "${RUNNER_TEMP_JSON}")"
          target_branch="$(jq -r '.targetBranch' "${RUNNER_TEMP_JSON}")"
          target_tag="$(jq -r '.targetTag' "${RUNNER_TEMP_JSON}")"
          base_ref="$(jq -r '.baseRef // ""' "${RUNNER_TEMP_JSON}")"
          local_commit_count="$(jq -r '.localCommitCount // 0' "${RUNNER_TEMP_JSON}")"
          conflict_count="$(jq -r '.conflictFiles | length' "${RUNNER_TEMP_JSON}")"

          {
            echo "status=${status}"
            echo "target_branch=${target_branch}"
            echo "target_tag=${target_tag}"
            echo "base_ref=${base_ref}"
            echo "local_commit_count=${local_commit_count}"
            echo "conflict_count=${conflict_count}"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize merge conflicts
        if: steps.sync.outputs.status == 'merge_conflict'
        env:
          RUNNER_TEMP_JSON: ${{ runner.temp }}/upstream-tag-sync.json
        run: |
          {
            echo "## Merge conflicts"
            echo ""
            jq -r '.conflictFiles[] | "- \(.path) (\(.localCommitCount) local commit(s) touch this path above the upstream tag)"' "${RUNNER_TEMP_JSON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify sync branch
        if: steps.sync.outputs.status == 'created' && env.VERIFICATION != 'none'
        run: |
          set -euo pipefail
          pnpm check
          if [[ "${VERIFICATION}" == "check-and-build" ]]; then
            pnpm build
          fi

      - name: Push sync branch
        if: steps.sync.outputs.status == 'created'
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${{ steps.sync.outputs.target_branch }}"

      - name: Ensure sync pull request
        id: pr
        if: steps.sync.outputs.status == 'created' || steps.sync.outputs.status == 'noop_existing_branch'
        uses: actions/github-script@v8
        env:
          PR_BASE: ${{ env.BASE_BRANCH }}
          PR_MODE: ${{ env.PR_MODE }}
          SYNC_BASE_REF: ${{ steps.sync.outputs.base_ref }}
          SYNC_BRANCH: ${{ steps.sync.outputs.target_branch }}
          SYNC_JSON_PATH: ${{ runner.temp }}/upstream-tag-sync.json
          SYNC_LOCAL_COMMIT_COUNT: ${{ steps.sync.outputs.local_commit_count }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_TARGET_TAG: ${{ steps.sync.outputs.target_tag }}
        with:
          script: |
            const fs = require("node:fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.PR_BASE;
            const headBranch = process.env.SYNC_BRANCH;
            const head = `${owner}:${headBranch}`;

            if (!headBranch) {
              core.setOutput("status", "skipped_missing_branch");
              return;
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head,
              base,
              per_page: 100,
            });
            if (openPulls.length > 0) {
              core.setOutput("status", "existing_open");
              core.setOutput("url", openPulls[0].html_url);
              core.setOutput("number", String(openPulls[0].number));
              return;
            }

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              head,
              base,
              per_page: 100,
            });
            if (closedPulls.length > 0) {
              core.setOutput("status", "existing_closed");
              core.setOutput("url", closedPulls[0].html_url);
              core.setOutput("number", String(closedPulls[0].number));
              return;
            }

            const syncData = JSON.parse(fs.readFileSync(process.env.SYNC_JSON_PATH, "utf8"));
            const localCommitLines = (syncData.localCommits ?? [])
              .slice(0, 20)
              .map((commit) => {
                const mergeSuffix = commit.isMerge ? " [merge]" : "";
                return `- ${commit.sha.slice(0, 12)} ${commit.subject}${mergeSuffix}`;
              });
            if ((syncData.localCommitCount ?? 0) > localCommitLines.length) {
              localCommitLines.push(
                `- ... and ${(syncData.localCommitCount ?? 0) - localCommitLines.length} more`,
              );
            }

            const title = `sync: merge ${process.env.SYNC_TARGET_TAG} into ${base}`;
            const bodyLines = [
              "## Summary",
              "",
              `- upstream tag: \`${process.env.SYNC_TARGET_TAG}\``,
              `- base branch: \`${base}\``,
              `- sync branch: \`${headBranch}\``,
              `- base ref: \`${process.env.SYNC_BASE_REF || "n/a"}\``,
              `- sync status: \`${process.env.SYNC_STATUS}\``,
              `- carried local commits: ${process.env.SYNC_LOCAL_COMMIT_COUNT || "0"}`,
              `- verification: \`${process.env.VERIFICATION || "check"}\``,
              "",
              "## Local commits carried forward",
              "",
              ...(localCommitLines.length > 0
                ? localCommitLines
                : ["- No local-only commits were detected above the upstream tag."]),
            ];

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: headBranch,
              base,
              body: bodyLines.join("\n"),
              draft: process.env.PR_MODE !== "ready",
            });

            core.setOutput("status", "created");
            core.setOutput("url", created.data.html_url);
            core.setOutput("number", String(created.data.number));

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Upstream tag sync"
            echo ""
            echo "- status: ${{ steps.sync.outputs.status || 'not-run' }}"
            echo "- base branch: ${BASE_BRANCH}"
            echo "- target tag: ${{ steps.sync.outputs.target_tag || 'n/a' }}"
            echo "- target branch: ${{ steps.sync.outputs.target_branch || 'n/a' }}"
            echo "- base ref: ${{ steps.sync.outputs.base_ref || 'n/a' }}"
            echo "- carried local commits: ${{ steps.sync.outputs.local_commit_count || '0' }}"
            echo "- merge conflicts: ${{ steps.sync.outputs.conflict_count || '0' }}"
            echo "- verification: ${VERIFICATION}"
            echo "- pull request: ${{ steps.pr.outputs.url || 'n/a' }}"
            echo "- pull request status: ${{ steps.pr.outputs.status || 'not-run' }}"
          } >> "$GITHUB_STEP_SUMMARY"
